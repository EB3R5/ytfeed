<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ytfeed{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <nav class="topnav">
    <span class="brand">ytfeed</span>
    <a href="/" class="{{ 'active' if active_page == 'recents' else '' }}">Recents</a>
    <a href="/subscriptions" class="{{ 'active' if active_page == 'subscriptions' else '' }}">Subscriptions</a>
    <a href="/playlists" class="{{ 'active' if active_page == 'playlists' else '' }}">Playlists</a>
    <a href="/queue" class="{{ 'active' if active_page == 'queue' else '' }}">Queue</a>
    <a href="/settings" class="{{ 'active' if active_page == 'settings' else '' }}">Settings</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
