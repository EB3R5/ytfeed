{% extends "base.html" %}
{% block title %}Recents — ytfeed{% endblock %}
{% block content %}
<h1>Recents</h1>

<form class="filters"
      hx-get="/"
      hx-target="#video-list"
      hx-swap="outerHTML"
      hx-trigger="change, keyup changed delay:300ms from:input[name='q']">
  <details class="channel-picker">
    <summary>
      Channels
      {% if used_picker %}(one-off selection){% else %}(monitored ★){% endif %}
    </summary>
    <div class="picker-list">
      {% for channel in channels %}
      <label class="picker-item">
        <input type="checkbox" name="channel" value="{{ channel.channel_id }}"
               {{ 'checked' if channel.channel_id in selected_channel_ids else '' }}>
        {{ channel.title }} {% if channel.is_monitored %}★{% endif %}
      </label>
      {% endfor %}
    </div>
  </details>
  <input type="search" name="q" value="{{ q }}" placeholder="Search titles…">
  <select name="transcript_status">
    <option value="">any transcript status</option>
    {% for s in ['none', 'queued', 'in_progress', 'done', 'failed', 'placeholder'] %}
    <option value="{{ s }}" {{ 'selected' if transcript_status == s else '' }}>{{ s }}</option>
    {% endfor %}
  </select>
</form>

{% include "partials/video_list.html" %}
{% endblock %}
